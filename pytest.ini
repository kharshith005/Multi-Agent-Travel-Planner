[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
markers =
    unit: fast unit tests (no LLM or live-API calls)
    integration: integration tests (mocked LLM, no real API calls)
    slow: slow tests (full eval sweep or real API round-trips)
    requires_api_key: tests that need real API keys — skipped in CI by default
